name: Publish DSH Chrome Control Package

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Optional exact package version to verify before publishing"
        required: false
        type: string

concurrency:
  group: publish-dsh-tool-control-chrome
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-tool-control-chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm run check

      - name: Verify requested version
        if: inputs.expected_version != ''
        run: node -e "if (require('./package.json').version !== process.env.EXPECTED_VERSION) throw new Error('package version mismatch')"
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}

      - name: Test
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm run build

      - name: Pack check
        run: npm pack --dry-run --ignore-scripts

      - name: Publish
        run: npm publish --access public
