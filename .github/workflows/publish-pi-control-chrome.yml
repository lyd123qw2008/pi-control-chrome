name: Publish Pi Control Chrome

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Optional exact package version to verify before publishing"
        required: false
        type: string

concurrency:
  group: publish-pi-control-chrome
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Verify requested version
        if: inputs.expected_version != ''
        run: node -e "if (require('./package.json').version !== process.env.EXPECTED_VERSION) throw new Error('package version mismatch')"
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}

      - name: Full test suite
        run: npm run test:all

      - name: Pack check
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public
