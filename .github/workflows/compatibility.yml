name: Compatibility and Profile Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  root:
    name: Root checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: CI-safe test suite
        run: npm run test:ci
      - name: Package dry run
        run: npm run pack:check

  dsh:
    name: DSH plugin checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: dsh-tool-control-chrome
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm run check
      - name: Test
        run: corepack pnpm test
      - name: Build
        run: corepack pnpm run build
      - name: Package dry run
        run: corepack pnpm run pack:check

  browsers:
    name: Isolated Chrome and Edge E2E matrix
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          # A four-part version selects Chrome for Testing instead of the runner's regular Chrome.
          chrome-version: 153.0.8010.36
      - name: Run isolated browser matrix
        run: npm run smoke:e2e:matrix
        env:
          PI_CONTROL_CHROME_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: Run isolated multi-profile E2E
        run: npm run smoke:e2e:multi-profile

